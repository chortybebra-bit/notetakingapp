# Folio behind an existing nginx.
#
#   1. Replace notes.example.com (e.g. 1-2-3-4.sslip.io for a VPS at 1.2.3.4).
#   2. sudo cp nginx.conf /etc/nginx/conf.d/folio.conf && sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d notes.example.com    (adds HTTPS and the http -> https redirect)

map $http_upgrade $folio_connection {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name notes.example.com;

    access_log off;
    # Encrypted updates can be up to 1.5 MB.
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $folio_connection;
        proxy_read_timeout 1h;
    }
}
